<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo Trading — Orders</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div data-testid="dashboard" class="dashboard">
      <nav data-testid="nav-menu" class="main-nav" role="navigation">
        <a data-testid="nav-trade" href="/trade">Trade</a>
        <a data-testid="nav-orders" href="/orders">Orders</a>
        <a data-testid="nav-positions" href="/positions">Positions</a>
      </nav>
      <h1>Orders</h1>
      <div role="tablist">
        <button role="tab" data-testid="orders-tab-working" type="button">Working</button>
        <button role="tab" data-testid="orders-tab-filled" type="button">Filled</button>
        <button role="tab" data-testid="orders-tab-canceled" type="button">Canceled</button>
      </div>
      <table data-testid="orders-table" id="orders-table" class="orders-table">
        <thead>
          <tr><th>Symbol</th><th>Status</th><th>Qty</th></tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
    <script src="/app.js"></script>
    <script>
      window.demoApp.requireSession();
      let activeTab = 'Working';

      async function loadOrders() {
        const statusMap = { Working: 'pending', Filled: 'filled', Canceled: 'cancelled' };
        const status = statusMap[activeTab];
        const data = await window.demoApp.api('GET', `/v1/orders?status=${status}`);
        const tbody = document.getElementById('orders-body');
        tbody.innerHTML = '';
        (data.orders || []).forEach((order) => {
          const tr = document.createElement('tr');
          tr.dataset.testid = `order-row-${order.symbol}`;
          tr.dataset.symbol = order.symbol;
          tr.innerHTML = `<td>${order.symbol}</td><td>${order.status}</td><td>${order.quantity}</td>`;
          tbody.appendChild(tr);
        });
      }

      document.querySelectorAll('[role="tab"]').forEach((tab) => {
        tab.addEventListener('click', () => {
          activeTab = tab.textContent.trim();
          loadOrders();
        });
      });

      loadOrders();
    </script>
  </body>
</html>
